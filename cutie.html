<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>hello cutie..</title>

  <!-- Confetti library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg1: #ffd6e7;
      --bg2: #ffeef6;
      --card: #ffffffcc;
      --yes: #ff3b7a;
      --yesHover: #ff1f68;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #fff0f7, #ffd6e7, #ffb3d1);
      background-size: 200% 200%;
      animation: bgMove 8s ease infinite;
      font-family: system-ui, sans-serif;
      overflow: hidden;
      padding: 16px;
    }

    @keyframes bgMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    #confettiCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }

    .card {
      width: min(520px, 100vw);
      padding: 22px 20px;
      background: linear-gradient(145deg, #ffffffdd, #ffe6f1dd);
      backdrop-filter: blur(14px);
      border-radius: 24px;
      text-align: center;
      box-shadow:
        0 20px 60px rgba(255, 59, 122, .25),
        inset 0 0 20px rgba(255,255,255,.6);
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0); }
    }

    .art {
      width: min(260px, 80vw);
      margin: 0 auto 10px;
      display: block;
      filter: drop-shadow(0 10px 14px rgba(0,0,0,.12));
    }

    h1 {
      font-size: clamp(26px, 4vw, 44px);
      margin: 12px 0 18px;
      color: #ff2f75;
      text-shadow: 0 0 12px rgba(255, 59, 122, .4);
    }

    .button-zone {
      position: relative;
      width: min(420px, 92%);
      height: 110px;
      margin: 0 auto;
      touch-action: none;
    }

    button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      padding: 16px 26px;
      font-size: 18px;
      font-weight: 900;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      box-shadow:
        0 10px 24px rgba(0,0,0,.14),
        inset 0 -4px 0 rgba(0,0,0,.15);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: left 0.2s linear, top 0.2s linear, transform 0.1s ease;
    }

    button:hover {
      transform: translateY(-52%) scale(1.05);
      box-shadow: 0 14px 32px rgba(0,0,0,.2);
    }

    button:active {
      transform: translateY(-48%) scale(.95);
    }

    #yesBtn {
      left: 18%;
      background: linear-gradient(135deg, #ff4d88, #ff1f68);
      color: #fff;
      box-shadow:
        0 0 20px rgba(255, 31, 104, .6),
        0 12px 24px rgba(0,0,0,.2);
    }

    #yesBtn:hover {
      background: linear-gradient(135deg, #ff1f68, #ff4d88);
    }

    #noBtn {
      left: 62%;
      background: #e5e7eb;
      color: #111827;
    }

    .hint {
      margin-top: 10px;
      font-size: 13px;
      opacity: .7;
    }

    .result {
      display: none;
      margin-top: 18px;
      animation: pop .35s ease;
    }

    .result h2 {
      font-size: clamp(30px, 4.5vw, 46px);
      margin: 10px 0;
      color: #ff2f75;
      text-shadow:
        0 0 10px rgba(255, 59, 122, .6),
        0 0 20px rgba(255, 59, 122, .4);
    }

    .fireworks {
      width: min(380px, 90vw);
      margin: 0 auto;
      display: block;
    }

    @keyframes pop {
      from { transform: scale(.96); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    body::before, body::after {
      content: "💖 💕 💗 💓 💞";
      position: fixed;
      width: 100%;
      text-align: center;
      font-size: 32px;
      opacity: .15;
      animation: heartsFloat 12s linear infinite;
      pointer-events: none;
    }

    body::after {
      animation-delay: 6s;
      top: 100%;
    }

    @keyframes heartsFloat {
      from { transform: translateY(100%); }
      to { transform: translateY(-120%); }
    }

    /* HEART BURST */
    .heart {
      position: fixed;
      font-size: 22px;
      pointer-events: none;
      animation: heartPop 0.9s ease forwards;
    }

    @keyframes heartPop {
      from {
        transform: scale(0) translateY(0);
        opacity: 1;
      }
      to {
        transform: scale(1.5) translateY(-40px);
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  <audio id="bgMusic" autoplay loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <canvas id="confettiCanvas"></canvas>

  <main class="card">
    <svg class="art" viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="fur" x1="0" x2="1">
          <stop offset="0" stop-color="#f7c7a1"/>
          <stop offset="1" stop-color="#f2a97b"/>
        </linearGradient>
        <linearGradient id="heart" x1="0" x2="1">
          <stop offset="0" stop-color="#ff4d7d"/>
          <stop offset="1" stop-color="#ff1f68"/>
        </linearGradient>
      </defs>

      <path d="M250 50 C250 33 270 25 282 38
               C294 25 314 33 314 50
               C314 78 282 92 282 106
               C282 92 250 78 250 50Z"
            fill="url(#heart)"/>

      <path d="M90 120 C90 70 140 40 190 60
               C240 40 290 70 290 120
               C290 180 240 210 190 210
               C140 210 90 180 90 120Z"
            fill="url(#fur)"/>

      <path d="M110 92 L95 55 L140 78 Z" fill="#f2a97b"/>
      <path d="M270 92 L285 55 L240 78 Z" fill="#f2a97b"/>

      <circle cx="160" cy="130" r="8"/>
      <circle cx="220" cy="130" r="8"/>

      <path d="M190 144 C186 144 182 148 182 152
               C182 160 190 164 190 170
               C190 164 198 160 198 152
               C198 148 194 144 190 144Z"
            fill="#ff7aa2"/>
    </svg>

    <h1>Do you love me Cutie?</h1>

    <section class="button-zone" id="zone">
      <button id="yesBtn">Yes</button>
      <button id="noBtn">No</button>
    </section>

    <div class="hint" id="hint">“No” seems a bit shy 😈</div>

    <section class="result" id="result">
      <h2>ummah..😘🥰 i know u ... 😚😚😚😚😚</h2>
      <img
        class="fireworks"
        src="https://gifdb.com/images/high/escape-door-tom-and-jerry-aldsr38ifhlq4zx9.webp"
        alt="Fireworks"
      />
    </section>
  </main>

  <script>
    const zone = document.getElementById("zone");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const result = document.getElementById("result");
    const hint = document.getElementById("hint");
    const confettiCanvas = document.getElementById("confettiCanvas");
    const music = document.getElementById("bgMusic");

    function tryPlayMusic() {
      music.play().catch(() => {
        document.body.addEventListener("pointerdown", () => {
          music.play();
        }, { once: true });
      });
    }
    tryPlayMusic();

    function resizeConfettiCanvas() {
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      confettiCanvas.width = Math.floor(window.innerWidth * dpr);
      confettiCanvas.height = Math.floor(window.innerHeight * dpr);
      confettiCanvas.style.width = "100vw";
      confettiCanvas.style.height = "100vh";
    }

    resizeConfettiCanvas();
    window.addEventListener("resize", resizeConfettiCanvas);
    window.addEventListener("orientationchange", () => setTimeout(resizeConfettiCanvas, 150));

    const confettiInstance = confetti.create(confettiCanvas, {
      resize: false,
      useWorker: true
    });

    function fullScreenConfetti() {
      const end = Date.now() + 1600;
      (function frame() {
        confettiInstance({
          particleCount: 12,
          spread: 90,
          startVelocity: 45,
          ticks: 180,
          origin: { x: Math.random(), y: Math.random() * 0.3 }
        });
        if (Date.now() < end) requestAnimationFrame(frame);
      })();

      setTimeout(() => {
        confettiInstance({
          particleCount: 300,
          spread: 140,
          startVelocity: 60,
          ticks: 220,
          origin: { x: 0.5, y: 0.55 }
        });
      }, 300);
    }

    let yesScale = 1;
    function growYes() {
      yesScale = Math.min(1.6, yesScale + 0.05);
      yesBtn.style.transform = `translateY(-50%) scale(${yesScale})`;
    }

    let moving = false;
    let moveInterval = null;

    function moveNoButton() {
      const z = zone.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();

      let newLeft = Math.random() * (z.width - b.width);
      let newTop  = Math.random() * (z.height - b.height);

      noBtn.style.left = newLeft + "px";
      noBtn.style.top = newTop + "px";
      noBtn.style.transform = "translateY(-50%)";
    }

    function escapeNo(e) {
      e.preventDefault();
      e.stopPropagation();

      if (!moving) {
        moving = true;
        moveInterval = setInterval(() => {
          moveNoButton();
          growYes();
        }, 450);
      }
    }

    ["mouseenter", "mouseover", "pointerover", "mousedown", "pointerdown", "touchstart", "click"]
      .forEach(evt => {
        noBtn.addEventListener(evt, escapeNo, { passive: false });
      });

    yesBtn.addEventListener("click", () => {
      if (moveInterval) clearInterval(moveInterval);
      zone.style.display = "none";
      hint.style.display = "none";
      result.style.display = "block";
      resizeConfettiCanvas();
      fullScreenConfetti();
    });
  </script>
</body>
</html>
